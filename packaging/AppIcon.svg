<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14261f"/>
      <stop offset="1" stop-color="#040807"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#b9792a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- rays -->
  <g stroke="#e7b660" stroke-opacity="0.14" stroke-width="6">
    <line x1="512" y1="330" x2="512" y2="150"/><line x1="512" y1="330" x2="330" y2="180"/>
    <line x1="512" y1="330" x2="694" y2="180"/><line x1="512" y1="330" x2="200" y2="290"/>
    <line x1="512" y1="330" x2="824" y2="290"/>
  </g>
  <!-- capstone, separate -->
  <g filter="url(#glow)">
    <polygon points="512,240 622,420 402,420" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M452 352 Q512 300 572 352 Q512 404 452 352 Z" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="512" cy="352" r="18" fill="#ffe2a0"/>
  </g>
  <!-- base, with courses of stone -->
  <g fill="none" stroke="url(#gold)" stroke-linejoin="round" stroke-width="10">
    <polygon points="382,452 642,452 790,760 234,760"/>
  </g>
  <g stroke="#c9934a" stroke-opacity="0.6" stroke-width="4">
    <line x1="366" y1="520" x2="658" y2="520"/><line x1="335" y1="590" x2="690" y2="590"/>
    <line x1="302" y1="660" x2="722" y2="660"/>
    <line x1="512" y1="452" x2="512" y2="520"/><line x1="440" y1="520" x2="440" y2="590"/>
    <line x1="584" y1="520" x2="584" y2="590"/><line x1="512" y1="590" x2="512" y2="660"/>
    <line x1="400" y1="660" x2="400" y2="760"/><line x1="624" y1="660" x2="624" y2="760"/>
  </g>
</svg>
